[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalmatch"
version = "0.3.0"
description = "Vocal Match analysis prototype: estimate a vocal effect chain from a reference song"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Source separation of full songs (milestone 4): Demucs + PyTorch, large.
separation = ["demucs>=4.0"]

[project.scripts]
vocalmatch = "vocalmatch.cli:main"

[tool.setuptools.packages.find]
include = ["vocalmatch*"]

[tool.setuptools.package-data]
vocalmatch = ["data/*.json"]
